<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .glass {
      transform-origin: 100px 100px;
      animation: glassPulse 1.1s ease-in-out 1.2s infinite;
    }
    .arm {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawArm 3.3s ease-in-out infinite;
    }
    @keyframes drawArm {
      0%   { stroke-dashoffset: 100; }
      35%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glassPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.94); opacity: 0.7; }
    }
  </style>

  <!-- Outer dial outline (static, same weight as hourglass) -->
  <circle cx="100" cy="100" r="95" fill="none"
          stroke="#8CE63A" stroke-width="12"/>

  <!-- Hourglass: outlines itself, then pulses -->
  <g class="glass" fill="none" stroke="#8CE63A" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <path class="arm" pathLength="100" d="M170 48 A95 95 0 0 0 30 48"/>
    <path class="arm" pathLength="100" d="M30 152 A95 95 0 0 0 170 152"/>
    <path class="arm" pathLength="100" d="M30 48 L75 100 L30 152"/>
    <path class="arm" pathLength="100" d="M170 48 L125 100 L170 152"/>
  </g>
</svg>