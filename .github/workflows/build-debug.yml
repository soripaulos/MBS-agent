name: Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - claude/oauth-mcp-frappe-assistant-qhyl4c

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # material3 compiles the material-color-utilities git submodule
          # (material3/material-color-utilities/kotlin); without it, DynamicScheme
          # is missing its newer color roles and the build fails to compile.
          submodules: recursive

      # gradle/gradle-daemon-jvm.properties pins the Gradle daemon to a JetBrains JDK 21.
      # Running Gradle on exactly that JDK means it is already satisfied, instead of being
      # downloaded through the foojay resolver (which has failed builds with HTTP 400).
      - name: Set up JDK (JetBrains 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      # web-ui is a pnpm project that the :web module builds during preBuild
      # (pnpm install + pnpm run build), so pnpm and Node must be on PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # The debug build type uses the auto-generated debug keystore and the project does not
      # apply the google-services plugin, so no signing secrets or google-services.json are
      # required here (unlike release.yml).
      # Telegram account integration: TDLib's prebuilt Android library with JNI bindings
      # (up9cloud/android-libtdjson, MIT; TDLib itself is Boost-licensed). Not checked in
      # (~20 MB per ABI); without it the feature reports itself unavailable instead of
      # failing. Only the ABI this build packages is copied.
      - name: Fetch TDLib (libtdjson.so)
        continue-on-error: true
        run: |
          set -e
          TD_VERSION=v1.8.65
          mkdir -p /tmp/tdlib && cd /tmp/tdlib
          curl -fsSL -o jniLibs.tar.gz "https://github.com/up9cloud/android-libtdjson/releases/download/${TD_VERSION}/jniLibs.tar.gz"
          tar -xzf jniLibs.tar.gz
          SO=$(find . -path '*arm64-v8a*' -name 'libtdjson.so' | head -n1)
          test -n "$SO"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp "$SO" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          # Single-ABI build: produces only app-arm64-v8a-debug.apk (see app/build.gradle.kts)
          ./gradlew assembleDebug -PsingleAbi=arm64-v8a --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
