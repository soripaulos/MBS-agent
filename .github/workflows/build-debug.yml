name: Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - claude/oauth-mcp-frappe-assistant-qhyl4c

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # material3 compiles the material-color-utilities git submodule
          # (material3/material-color-utilities/kotlin); without it, DynamicScheme
          # is missing its newer color roles and the build fails to compile.
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web-ui is a pnpm project that the :web module builds during preBuild
      # (pnpm install + pnpm run build), so pnpm and Node must be on PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # The debug build type uses the auto-generated debug keystore and the project does not
      # apply the google-services plugin, so no signing secrets or google-services.json are
      # required here (unlike release.yml).
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
